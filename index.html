<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[PRUEBAS] Verificación de Certificados — Alcaldía de Caucasia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .header {
      width: 100%; max-width: 580px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1d4ed8 100%);
      border-radius: 14px;
      padding: 24px 28px;
      color: white;
      margin-bottom: 24px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
    .header p  { font-size: 12px; color: #bfdbfe; margin-top: 4px; }
    .test-badge {
      display: inline-block;
      background: #fef9c3;
      color: #854d0e;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .card {
      width: 100%; max-width: 580px;
      background: white;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
    }
    input:focus { border-color: #1d4ed8; background: #eff6ff; }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover   { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #resultado { margin-top: 20px; display: none; border-radius: 10px; overflow: hidden; }
    .res-header {
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .res-body { padding: 16px 18px; }
    .autentico .res-header { background: #ecfdf5; color: #065f46; }
    .autentico .res-body   { background: #f0fdf4; border: 1px solid #bbf7d0; border-top: none; border-radius: 0 0 10px 10px; }
    .invalido .res-header  { background: #fef2f2; color: #991b1b; }
    .invalido .res-body    { background: #fff5f5; border: 1px solid #fecaca; border-top: none; border-radius: 0 0 10px 10px; }
    .cargando .res-header  { background: #eff6ff; color: #1e3a8a; }
    .cargando .res-body    { background: #f8fafc; border: 1px solid #bfdbfe; border-top: none; border-radius: 0 0 10px 10px; }
    .campo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      gap: 10px;
    }
    .campo:last-child { border-bottom: none; }
    .campo .lbl { color: #64748b; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .campo .val { color: #1e293b; font-weight: 700; text-align: right; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge-estrato { background: #dbeafe; color: #1e3a8a; }
    .badge-tipo    { background: #fef9c3; color: #854d0e; }
    /* Debug panel */
    #debug {
      margin-top: 16px;
      background: #0f172a;
      color: #94a3b8;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 11px;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
    .debug-toggle {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
      text-decoration: underline;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      max-width: 580px;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 3px solid #bfdbfe;
      border-top-color: #1d4ed8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>ALCALDÍA DE CAUCASIA</h1>
    <p>Sistema de Verificación de Certificados de Estratificación</p>
    <span class="test-badge">SERVIDOR DE PRUEBAS</span>
  </div>

  <div class="card">
    <label for="codigo">Código del certificado</label>
    <input
      id="codigo"
      type="text"
      placeholder="CERT-XXXXXXXX"
      autocomplete="off"
      spellcheck="false"
      maxlength="25"
    />
    <button id="btnVerificar" onclick="verificar()">Verificar autenticidad</button>

    <div id="resultado"></div>
    <div class="debug-toggle" onclick="toggleDebug()">Ver información técnica</div>
    <div id="debug"></div>
  </div>

  <div class="footer">
    Este sistema consulta la base de datos oficial de la Alcaldía de Caucasia en tiempo real.
  </div>

  <script>
    // ══════════════════════════════════════════════════════════
    // CONFIGURACIÓN — extraída del sistema de certificados
    // ══════════════════════════════════════════════════════════
    const PROJECT_ID      = "prueba-e42fa";
    // Path completo de la colección en Firestore
    const COLLECTION_FULL = "artifacts/prueba-e42fa/public/data/history";

    // Descomponer el path para la API REST:
    // parent = todo menos el último segmento
    // collectionId = último segmento
    const pathParts    = COLLECTION_FULL.split("/");
    const COLLECTION_ID = pathParts[pathParts.length - 1];          // "history"
    const PARENT_PATH   = pathParts.slice(0, -1).join("/");          // "artifacts/.../data"

    // URL base de Firestore REST
    const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

    // URL correcta para runQuery en subcolección
    const QUERY_URL = `${BASE}/${PARENT_PATH}:runQuery`;

    let debugLog = [];
    function log(msg) {
      debugLog.push(msg);
      document.getElementById("debug").textContent = debugLog.join("\n");
    }
    function toggleDebug() {
      const el = document.getElementById("debug");
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    // Leer código desde la URL (cuando viene del QR)
    const params   = new URLSearchParams(window.location.search);
    const codigoQR = params.get("c") || params.get("code") || params.get("cert") || params.get("q");
    if (codigoQR) {
      document.getElementById("codigo").value = codigoQR.trim().toUpperCase();
      window.addEventListener("load", () => setTimeout(verificar, 400));
    }

    document.getElementById("codigo").addEventListener("keydown", e => {
      if (e.key === "Enter") verificar();
    });

    // Extraer valor de campo Firestore (maneja stringValue, integerValue, etc.)
    function fv(field, fallback = "—") {
      if (!field) return fallback;
      return field.stringValue
          ?? field.integerValue
          ?? field.doubleValue
          ?? (field.booleanValue !== undefined ? String(field.booleanValue) : null)
          ?? fallback;
    }

    async function verificar() {
      const input  = document.getElementById("codigo");
      const codigo = input.value.trim().toUpperCase();
      const div    = document.getElementById("resultado");
      const btn    = document.getElementById("btnVerificar");

      if (!codigo || codigo.length < 4) { input.focus(); return; }

      debugLog = [];
      log(`Buscando: "${codigo}"`);
      log(`Query URL: ${QUERY_URL}`);
      log(`collectionId: ${COLLECTION_ID}`);

      div.style.display = "block";
      div.innerHTML = `<div class="cargando">
        <div class="res-header"><span class="spinner"></span> Verificando en la base de datos...</div>
        <div class="res-body" style="color:#64748b;font-size:13px;">Consultando servidor oficial…</div>
      </div>`;
      btn.disabled = true;

      try {
        const body = {
          structuredQuery: {
            from: [{ collectionId: COLLECTION_ID, allDescendants: false }],
            where: {
              fieldFilter: {
                field: { fieldPath: "cert_code" },
                op: "EQUAL",
                value: { stringValue: codigo }
              }
            },
            limit: 1
          }
        };

        log(`\nRequest body:\n${JSON.stringify(body, null, 2)}`);

        const resp = await fetch(QUERY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const text = await resp.text();
        log(`\nHTTP status: ${resp.status}`);
        log(`Response:\n${text}`);

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}: ${text.substring(0, 200)}`);
        }

        const data = JSON.parse(text);

        // Firestore devuelve array; si el primer elemento tiene "document" → encontrado
        if (Array.isArray(data) && data[0] && data[0].document) {
          const f = data[0].document.fields || {};
          log("\n✅ Documento encontrado");
          log(`Campos: ${Object.keys(f).join(", ")}`);

          const nombre      = fv(f["Nombre"]);
          const consecutivo = fv(f["Consecutivo"]);
          const estrato     = fv(f["Estrato"]);
          const direccion   = fv(f["Dirección"]);
          const barrio      = fv(f["Barrio"]);
          const doc_num     = fv(f["Número"]);
          const tipo_doc    = fv(f["[Tipo de documento]"] ?? f["Hist_TipoID"]);
          const tipo_cert   = (fv(f["TipoCertificado"]) === "comercial") ? "Comercial" : "Residencial";
          const fecha       = fv(f["Fecha corta"]);
          const generado    = fv(f["generadoPorNombre"]);
          const radicado    = fv(f["Radicado"], "Sin radicado");

          div.innerHTML = `
            <div class="autentico">
              <div class="res-header">✅ Certificado AUTÉNTICO</div>
              <div class="res-body">
                <div class="campo"><span class="lbl">Titular</span><span class="val">${nombre}</span></div>
                <div class="campo"><span class="lbl">Documento</span><span class="val">${tipo_doc}: ${doc_num}</span></div>
                <div class="campo"><span class="lbl">Dirección</span><span class="val">${direccion}${barrio !== "—" ? ", " + barrio : ""}</span></div>
                <div class="campo">
                  <span class="lbl">Estrato</span>
                  <span class="val"><span class="badge badge-estrato">Estrato ${estrato}</span></span>
                </div>
                <div class="campo">
                  <span class="lbl">Tipo</span>
                  <span class="val"><span class="badge badge-tipo">${tipo_cert}</span></span>
                </div>
                <div class="campo"><span class="lbl">Consecutivo</span><span class="val">${consecutivo}</span></div>
                <div class="campo"><span class="lbl">Fecha de emisión</span><span class="val">${fecha}</span></div>
                <div class="campo"><span class="lbl">Radicado</span><span class="val">${radicado}</span></div>
                <div class="campo"><span class="lbl">Emitido por</span><span class="val">${generado}</span></div>
                <div class="campo">
                  <span class="lbl">Código</span>
                  <span class="val" style="color:#1d4ed8;letter-spacing:1px;">${codigo}</span>
                </div>
              </div>
            </div>`;

        } else {
          // Verificar si la respuesta tiene algún contenido útil para debug
          log("\n⚠️ No encontrado. Respuesta del servidor:");
          log(JSON.stringify(data, null, 2));

          div.innerHTML = `
            <div class="invalido">
              <div class="res-header">❌ Certificado NO encontrado</div>
              <div class="res-body" style="font-size:14px; color:#7f1d1d;">
                El código <strong>${codigo}</strong> no corresponde a ningún certificado
                emitido oficialmente.<br><br>
                <span style="color:#64748b; font-size:12px;">
                  Verifique que el código esté escrito correctamente.<br>
                  Active "Ver información técnica" abajo para más detalles.
                </span>
              </div>
            </div>`;
        }

      } catch (err) {
        log(`\n❌ Error: ${err.message}`);
        div.innerHTML = `
          <div class="invalido">
            <div class="res-header">⚠️ Error de conexión</div>
            <div class="res-body" style="font-size:13px; color:#64748b;">
              ${err.message}<br><br>
              <small>Active "Ver información técnica" para más detalles.</small>
            </div>
          </div>`;
      } finally {
        btn.disabled = false;
        document.getElementById("debug").textContent = debugLog.join("\n");
      }
    }
  </script>
</body>
</html>
